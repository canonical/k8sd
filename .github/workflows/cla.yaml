name: cla-check

on:
  pull_request:
    branches:
      - main
      - 'release-[0-9]*.[0-9]*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Needed to read repository metadata
  pull-requests: read # Needed to check PR author CLA status

jobs:
  cla-check:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: Check if CLA signed
        uses: canonical/has-signed-canonical-cla@19bae73390fdbfdc1ef9a9bb9408d87a1de755f6 # v2
