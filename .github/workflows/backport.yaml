name: Backport merged pull request
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] runs only after PR merge on base branch without checking out untrusted PR code
    types: [closed]
  issue_comment: # zizmor: ignore[dangerous-triggers] gated to OWNER/MEMBER/COLLABORATOR comments without checking out untrusted PR code
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read # Needed to read repository metadata

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed by backport-action to create and push backport branches
      pull-requests: write # Needed to create, label, and approve backport pull requests
    # Only run when pull request is merged
    # or when a comment containing `/backport` is created by someone other than the
    # https://github.com/backport-action bot user (user id: 97796249). Note that if you use your
    # own PAT as `github_token`, that you should replace this id with yours.
    # cdkbot's user ID is 99445902.
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 99445902 &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '/backport')
      )
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] korthout/backport-action relies on persisted git credentials for git push; job uploads no artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create backport pull requests
        id: create_backports
        uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          # Set (default) action parameters explicitly.
          branch_name: backport-${pull_number}-to-${target_branch}
          cherry_picking: auto
          copy_assignees: false
          copy_milestone: false
          copy_requested_reviewers: false
          experimental: >
            {
              "conflict_resolution": "fail"
            }
          github_token: ${{ secrets.BOT_TOKEN }}
          github_workspace: ${{ github.workspace }}
          label_pattern: ^backport ([^ ]+)$
          merge_commits: fail
          pull_description: |-
            # Description
            Backport of #${pull_number} to `${target_branch}`.
          pull_title: >-
            ${pull_title} [Backport ${target_branch}]

      - name: Label backports with automerge and approve
        env:
          GH_TOKEN: ${{ secrets.BACKPORT_APPROVAL_TOKEN }}
          CREATED_PULL_NUMBERS: ${{ steps.create_backports.outputs.created_pull_numbers }}
        run: |
          for pr_number in $CREATED_PULL_NUMBERS; do
            gh pr edit "$pr_number" --add-label "automerge"
            gh pr review "$pr_number" --approve
          done
