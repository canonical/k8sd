name: k8s-snap integration tests

# Builds the k8s-snap with the k8sd revision under test and runs the k8s-snap
# pull request integration test suite against it. This replaces the need to
# open a dummy k8s-snap PR that bumps build-scripts/components/k8sd/version.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      k8s-snap-ref:
        description: |
          k8s-snap branch or tag to build and collect tests from. Defaults to the
          k8s-snap branch matching the k8sd branch (falls back to main).
        type: string
        default: ""
      test-tags:
        description: Integration test filter tags (e.g. pull_request, up_to_nightly)
        type: string
        default: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K8S_SNAP_REPOSITORY: canonical/k8s-snap

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      k8s-snap-ref: ${{ steps.k8s-snap-ref.outputs.ref }}
      tests: ${{ steps.collect-tests.outputs.tests }}
      test-tags: ${{ steps.collect-tests.outputs.test-tags }}
    steps:
      - name: Determine k8s-snap ref
        id: k8s-snap-ref
        env:
          INPUT_REF: ${{ inputs.k8s-snap-ref }}
          # The PR target branch for pull requests, the selected branch otherwise.
          K8SD_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          elif git ls-remote --exit-code --heads "https://github.com/${K8S_SNAP_REPOSITORY}" "refs/heads/${K8SD_BRANCH}" > /dev/null; then
            # k8s-snap release-X.Y branches build k8sd from the matching k8sd branch.
            ref="$K8SD_BRANCH"
          else
            echo "::warning::No ${K8S_SNAP_REPOSITORY} branch named '${K8SD_BRANCH}', using main"
            ref="main"
          fi
          echo "Using ${K8S_SNAP_REPOSITORY}@${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out k8s-snap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.K8S_SNAP_REPOSITORY }}
          ref: ${{ steps.k8s-snap-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tox
        run: |
          for _ in $(seq 5); do
            timeout 5m sudo apt-get install -y tox && exit 0
            sleep 5
          done
          exit 1

      - name: Collect tests
        id: collect-tests
        env:
          TEST_TAGS: ${{ inputs.test-tags || 'pull_request' }}
        run: |
          cd tests/integration
          IFS=' ' read -ra TAGS <<< "$TEST_TAGS"
          TAGS_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAGS_ARGS+=(--tags "$tag")
          done

          TESTS=$(tox -e integration -- --collect-only "${TAGS_ARGS[@]}" --quiet --no-header tests/ | grep ::)
          echo "Found tests:"
          echo "$TESTS"

          echo "tests=$(printf '%s\n' "$TESTS" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "test-tags=${TEST_TAGS}" >> "$GITHUB_OUTPUT"

  build-snap:
    name: Build k8s-snap ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out k8s-snap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.K8S_SNAP_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.k8s-snap-ref }}
          persist-credentials: false

      - name: Point the k8sd component to the revision under test
        env:
          K8SD_REVISION: ${{ github.sha }}
        run: |
          component_dir=build-scripts/components/k8sd
          echo "https://github.com/${GITHUB_REPOSITORY}" > "${component_dir}/repository"

          # build-component.sh does a shallow clone of the component's version
          # branch and then runs pre-patch.sh from within the clone, which is
          # where we switch to the exact k8sd commit under test.
          if [ -e "${component_dir}/pre-patch.sh" ]; then
            mv "${component_dir}/pre-patch.sh" "${component_dir}/pre-patch.orig.sh"
          fi
          cat > "${component_dir}/pre-patch.sh" <<EOF
          git fetch --depth 1 origin "${K8SD_REVISION}"
          git checkout --detach "${K8SD_REVISION}"
          echo "Switched k8sd to commit \$(git rev-parse HEAD)"
          if [ -e "\$(dirname "\$0")/pre-patch.orig.sh" ]; then
            bash -xe "\$(dirname "\$0")/pre-patch.orig.sh"
          fi
          EOF

          cat "${component_dir}/repository" "${component_dir}/version" "${component_dir}/pre-patch.sh"

      - name: Setup LXD
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3

      - name: Install snapcraft
        run: |
          for _ in $(seq 5); do
            timeout 10m sudo snap install snapcraft --classic && exit 0
            sleep 5
          done
          exit 1

      - name: Build k8s snap
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft --use-lxd
          mv k8s_*.snap "k8s-${ARCH}.snap"

      - name: Upload k8s snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-${{ matrix.arch }}.snap
          path: k8s-${{ matrix.arch }}.snap

  test-integration:
    name: ${{ matrix.arch }} ${{ matrix.test }}
    needs: [prepare, build-snap]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        test: ${{ fromJson(needs.prepare.outputs.tests) }}
    steps:
      - name: Node cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Check out k8s-snap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.K8S_SNAP_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.k8s-snap-ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download k8s snap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-${{ matrix.arch }}.snap
          path: ${{ github.workspace }}

      - name: Setup LXD
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3
        with:
          bridges: "lxdbr0,dualstack-br0,ipv6-br0,jumbo-br0,dual-nic-br0"
          channel: "5.21/stable"

      - name: Install tox
        run: |
          for _ in $(seq 5); do
            timeout 5m sudo apt-get install -y tox && exit 0
            sleep 5
          done
          exit 1

      - name: Generate artifact name
        if: always()
        env:
          MATRIX_TEST: ${{ matrix.test }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "short_test_name=${MATRIX_TEST##*::}" >> "$GITHUB_ENV"
          name=$(echo "ubuntu-24.04-${ARCH}-${MATRIX_TEST}-$(uuidgen)" | sed 's/[\/:\.\]/-/g' | sed 's/\s//g')
          echo "test_name=${name}" >> "$GITHUB_ENV"

      - name: Run ${{ env.short_test_name }}
        env:
          TEST_SNAP: ${{ github.workspace }}/k8s-${{ matrix.arch }}.snap
          TEST_SUBSTRATE: lxd
          TEST_LXD_IMAGE: ubuntu:24.04
          TEST_INSPECTION_REPORTS_DIR: ${{ github.workspace }}/inspection-reports/${{ env.test_name }}
          TEST_MIRROR_LIST: '[{"name": "ghcr.io", "port": 5000, "remote": "https://ghcr.io", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}, {"name": "docker.io", "port": 5001, "remote": "https://registry-1.docker.io", "username": "", "password": ""}]'
          # Some tests derive snap tracks from the branch they run on.
          TEST_GH_REF: ${{ needs.prepare.outputs.k8s-snap-ref }}
          TEST_GH_BASE_REF: ${{ needs.prepare.outputs.k8s-snap-ref }}
          MATRIX_TEST: ${{ matrix.test }}
          TEST_TAGS: ${{ needs.prepare.outputs.test-tags }}
        run: |
          IFS=' ' read -ra TAGS <<< "$TEST_TAGS"
          cd tests/integration
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- tox -e integration -- "$MATRIX_TEST" --tags "${TAGS[@]}"

      - name: Prepare inspection reports
        if: failure()
        run: |
          mkdir -p inspection-report-archives
          tar -czvf "inspection-report-archives/${test_name}.tar.gz" -C "$GITHUB_WORKSPACE" "inspection-reports/${test_name}" || true

      - name: Upload inspection report artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspection-reports-${{ env.test_name }}
          path: ${{ github.workspace }}/inspection-report-archives/${{ env.test_name }}.tar.gz
