\* Mutation "stop-before-remove": TLC must report a counterexample.
CONSTANTS
    Nodes = {n1, n2, n3}
    Seed = n1
    NoNode = NoNode
    MaxCrashes = 2
    Mutation = "stop-before-remove"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    LeaseOwnsTransition
    SingleTransition
    AtMostOneLearner
    LearnerHoldsLease
    ActiveIsConfirmedVoter
    AbsentIsClean
    NoOrphanedEtcdMember
    DqliteRoleMatchesMembership
    ControlPlaneNeverEmpty

PROPERTIES
    ActivationRequiresQuorum
    EtcdReconfigPreservesQuorum
    DqliteReconfigPreservesQuorum
    OrchestratorNeverBreaksQuorum
    TransitionsTerminate
    LeaseEventuallyFree
    AdmissionsResolve
