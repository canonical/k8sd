\* Correct orchestrator: all safety + liveness properties must hold.
CONSTANTS
    Nodes = {n1, n2, n3}
    Seed = n1
    NoNode = NoNode
    MaxCrashes = 2
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    LeaseOwnsTransition
    SingleTransition
    AtMostOneLearner
    LearnerHoldsLease
    ActiveIsConfirmedVoter
    AbsentIsClean
    ControlPlaneNeverEmpty
    ProgressDeterministic

PROPERTIES
    ActivationRequiresQuorum
    EtcdReconfigPreservesQuorum
    DqliteReconfigPreservesQuorum
    OrchestratorNeverBreaksQuorum
    TransitionsTerminate
    LeaseEventuallyFree
