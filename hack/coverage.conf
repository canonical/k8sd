# Minimum total statement coverage percentage required by CI gate (floor).
# Evaluated on isolated per-package unit test coverage after exclusions.
COVERAGE_THRESHOLD=47.9

# Extended Regular Expressions (ERE) matched against module-relative file paths.
# Excluded files are omitted from the filtered coverage profile and statement coverage metrics.
COVERAGE_EXCLUDE=(
    # Test doubles and mock implementations (no production daemon logic)
    '/mock/'
    '/mock\.go$'
    '^pkg/k8sd/controllers/csrsigning/test/'

    # Microcluster test harnesses and test helpers
    '^pkg/utils/microcluster/'

    # Documentation generators (developer tooling run via make go.doc, not runtime code)
    '^pkg/docgen/'
    '^cmd/k8s/k8s_generate_docs\.go$'

    # Trivial CLI entrypoint (dispatches directly to root commands)
    '^cmd/main\.go$'
)
